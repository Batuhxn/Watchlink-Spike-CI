name: M3B-4A standalone vodozemac iOS feasibility

# Temporary public-safe repository. Manual, unsigned, isolated spike proof.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: spikes/vodozemac-m3b4-feasibility/rust
    steps:
      - name: Checkout standalone spike repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Check standalone repository allowlist and public safety
        run: python3 ../scripts/check-standalone.py
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc +1.98.1 --version
          cargo +1.98.1 --version
      - name: Confirm resolved dependency pins
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          packages = {p['name']: p for p in lock['package']}
          v = packages['vodozemac']
          u = packages['uniffi']
          assert v['version'] == '0.11.0'
          assert v['source'].endswith('#db1b34820f3102307284e762f335b3f72c735bf0')
          assert u['version'] == '0.32.2'
          print(f"vodozemac {v['version']} {v['source'].split('#')[-1]}; UniFFI {u['version']}")
          PY
      - name: Format, test, and lint Rust host suite
        run: |
          cargo +1.98.1 fmt --check
          cargo +1.98.1 test --locked
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Recheck standalone repository allowlist and public safety
        run: python3 ../scripts/check-standalone.py

  ios-spike:
    needs: rust-host
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - name: Checkout standalone spike repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Check standalone repository allowlist and public safety
        run: python3 spikes/vodozemac-m3b4-feasibility/scripts/check-standalone.py
      - name: Initialize isolated CI paths
        run: |
          set -euo pipefail
          {
            echo "M3B4_DERIVED_DATA=$RUNNER_TEMP/M3B4DerivedData"
            echo "M3B4_TEST_LOG=$RUNNER_TEMP/M3B4XCTest.log"
          } >> "$GITHUB_ENV"
      - name: Select canonical Xcode 26.3
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3
          xcodebuild -version
      - name: Install pinned Rust toolchain and required iOS targets
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build and verify isolated arm64 XCFramework
        run: spikes/vodozemac-m3b4-feasibility/scripts/build-ios.sh
      - name: Compile isolated Swift and XCTest with Xcode 26.3
        run: spikes/vodozemac-m3b4-feasibility/scripts/test-ios.sh compile
      - name: Select preinstalled Xcode 26.2 simulator
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select -s /Applications/Xcode_26.2.app
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.2
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/m3b4-runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/m3b4-devices.json"
          read -r runtime_id runtime_version udid device_type < <(
            python3 spikes/vodozemac-m3b4-feasibility/scripts/pick-simulator.py "$sdk" \
              "$RUNNER_TEMP/m3b4-runtimes.json" "$RUNNER_TEMP/m3b4-devices.json")
          if [ "$udid" = '-' ]; then
            udid="$(xcrun simctl create M3B4-CI "$device_type" "$runtime_id")"
            echo "M3B4_CREATED_SIM=$udid" >> "$GITHUB_ENV"
          fi
          echo "M3B4_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          echo "iOS Simulator runtime: $runtime_version"
      - name: Execute isolated XCTest suite on simulator
        run: spikes/vodozemac-m3b4-feasibility/scripts/test-ios.sh run
      - name: Delete disposable simulator
        if: ${{ always() && env.M3B4_CREATED_SIM != '' }}
        run: |
          xcrun simctl shutdown "$M3B4_CREATED_SIM" 2>/dev/null || true
          xcrun simctl delete "$M3B4_CREATED_SIM"
      - name: Restore Xcode 26.3
        if: ${{ always() }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3
      - name: Recheck standalone repository allowlist and public safety
        if: ${{ always() }}
        run: python3 spikes/vodozemac-m3b4-feasibility/scripts/check-standalone.py
